[project]
name = "learn_02"
version = "0.1.0"
description = "learn_02 using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.100.1,<1.0.0"
]

[project.scripts]
learn_02 = "learn_02.main:run"
run_crew = "learn_02.main:run"
train = "learn_02.main:train"
replay = "learn_02.main:replay"
test = "learn_02.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
